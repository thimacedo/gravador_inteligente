# CI — Gravador Inteligente
#
# Executa em cada push e PR:
# 1. Verifica formatação com ruff e black
# 2. Roda testes com pytest
#
# Requer: Python 3.11, FFmpeg instalado no sistema.

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check app/ tests/

      - name: Black check (formatação)
        run: black --check app/ tests/

      - name: Run tests
        run: pytest tests/ -v --tb=short
